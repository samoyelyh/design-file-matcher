[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "design-file-matcher"
version = "0.1.0"
description = "Local design file matching, safe renaming, and review workstation"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "pillow>=10,<13",
  "numpy>=1.26,<3",
  "scipy>=1.13,<2",
  "psd-tools>=1.10,<2",
  "python-multipart>=0.0.9,<1",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
dinov3 = [
  "torch>=2.7",
  "transformers>=4.56,<6",
  "huggingface-hub>=0.34,<2",
  "safetensors>=0.5,<1",
]
lightglue = [
  "opencv-python-headless>=4.10,<5",
  "kornia>=0.8,<1",
  "lightglue @ git+https://github.com/cvg/LightGlue.git@eb42fee2d71449efb0aa5c10549752b5d75384d8",
]
dev = [
  "pytest>=8,<9",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
